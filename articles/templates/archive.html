{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Архив статей</title>

    <link
        rel="stylesheet"
        href="{% static 'articles/css/article.css' %}"
    >
</head>

<body class="archive">

    <div class="header">

        <img
            src="{% static 'articles/logo.svg' %}"
            alt="Логотип блога"
        >

    </div>

    <div class="archive">

        {% for post in posts %}

            <div class="one-post">

                <h2 class="post-title">

                    <a href="{% url 'get_article' article_id=post.id %}">
                        {{ post.title }}
                    </a>

                </h2>

                <div class="article-info">

                    <div class="article-author">
                        Автор: {{ post.author.username }}
                    </div>

                    <div class="article-created-date">
                        {{ post.created_date|date:"d.m.Y" }}
                    </div>

                </div>

                <p class="article-text">
                    {{ post.get_excerpt }}
                </p>

            </div>

        {% empty %}

            <p>Статей пока нет.</p>

        {% endfor %}

    </div>

</body>
</html>
